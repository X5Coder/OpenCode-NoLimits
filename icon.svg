<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Symbol Gradient (Clean Electric Cyan to Sky Blue) -->
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Dark Disc -->
  <rect x="24" y="24" width="464" height="464" rx="140" ry="140" 
        fill="url(#bg)" stroke="#1f2937" stroke-width="3"/>

  <!-- Minimalist, Pure Infinity Loop (Zero clutter, bold and iconic) -->
  <path d="M 256 256 C 210 180 130 180 130 256 C 130 332 210 332 256 256 C 302 180 382 180 382 256 C 382 332 302 332 256 256 Z" 
        fill="none" stroke="url(#symbolGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Crisp Core Center Light -->
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>
</svg>
